name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Calculer le chemin de base
        id: base
        # Avec un domaine personnalisé (public/CNAME), le site est servi à la racine.
        # Sinon, on reprend le chemin donné par GitHub Pages (/<nom-du-repo>).
        run: |
          if [ -s public/CNAME ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build (export statique)
        run: npm run build
        env:
          # "" avec un domaine personnalisé, "/<repo>" sinon (voir étape précédente)
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
